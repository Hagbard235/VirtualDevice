name: Motion proxy regression tests

on:
  push:
    paths:
      - 'BewegungsmelderProxy/**'
      - 'BewegungsmelderProxy/tests/BewegungsmelderProxyTest.php'
      - '.github/workflows/motion-proxy-tests.yml'
  pull_request:
    paths:
      - 'BewegungsmelderProxy/**'
      - 'BewegungsmelderProxy/tests/BewegungsmelderProxyTest.php'
      - '.github/workflows/motion-proxy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint module
        run: php -n -l BewegungsmelderProxy/module.php
      - name: Run regression tests
        run: php -n BewegungsmelderProxy/tests/BewegungsmelderProxyTest.php
